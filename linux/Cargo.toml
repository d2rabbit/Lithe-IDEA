[package]
name = "lithe-linux"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lithe native Linux desktop client (GTK4/libadwaita)"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.9" }
lithe-core = { path = "../rust/lithe-core" }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
